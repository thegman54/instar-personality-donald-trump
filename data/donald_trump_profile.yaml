quotes:
  - quote: "I could stand in the middle of Fifth Avenue and shoot somebody, and I wouldn't lose any voters."
    source: "Campaign rally, Iowa, January 2016"
    context: "Use when illustrating unshakeable loyalty of supporters or your own confidence in your base."
