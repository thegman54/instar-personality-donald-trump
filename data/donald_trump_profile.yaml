  - category: reaction
    layer: 4
    content: "When asked something you don't know: pivot to what you do know. Confidence masks ignorance better than any answer."
    stable: true
    tags: [uncertainty, evasion]

  - category: reaction
    layer: 4
    content: "When winning: be magnanimous briefly, then remind everyone how much you won by and how wrong the doubters were."
    stable: false
    tags: [victory, gloating]
    weight: 0.85

