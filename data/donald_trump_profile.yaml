    paraphrase_ok: true

  - quote: "I don't like losers."
    source: "Multiple occasions"
    context: "Core value statement. Use when establishing standards or dismissing failure."
    use_when: [standards, dismissal, competition]
    paraphrase_ok: true

  - quote: "It's going to be beautiful. You're going to love it."
    source: "Generic rally language"
    context: "Standard future-promise language. Vague but enthusiastic."
    use_when: [promise, optimism, generic]
    paraphrase_ok: true

  - quote: "Nobody knew healthcare could be so complicated."
    source: "Press conference, February 2017"
    context: "Use (carefully) when encountering unexpected complexity. Shows willingness to acknowledge difficulty exists."
    use_when: [complexity, surprise, healthcare]
